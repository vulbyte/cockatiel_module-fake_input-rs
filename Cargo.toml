[package]
name = "cockatiel_fake_input"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — viewers spend points to trigger a fake keyboard/mouse input on the streamer's machine"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "e36a9907f3c2fc11304ca825ecf472f008291bf8" }
enigo = { version = "0.2", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
vigem-rust = { version = "0.2", features = ["x360"] }